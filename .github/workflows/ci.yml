name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and current Python
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile skills/video-transcribe/scripts/transcribe.py
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI help
        run: python skills/video-transcribe/scripts/transcribe.py --help
